name: Build wheel  
  
on:  
  push:  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: windows-latest  
    steps:  
      - uses: actions/checkout@v4  
      - uses: astral-sh/setup-uv@v5  
      - name: Install Python  
        run: uv python install 3.11  
      - name: Build wheel  
        run: uv run --python 3.11 --with build python -m build --wheel --outdir dist  
      - name: Upload wheel artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: wavetable-wheel  
          path: dist/*.whl
